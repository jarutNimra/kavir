<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./src/swiper/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./src/css/main.css" />
  </head>
  <body>
    <!--start project-->
    <div class="wrapper">
      <!--menu-->
      <div class="menu">
        <nav class="nav-bar">
          <div class="nav-item"><a href="#" class="nav-link">home</a></div>
          <div class="nav-item"><a href="#" class="nav-link">about</a></div>
          <div class="nav-item"><a href="#" class="nav-link">contact</a></div>
          <div class="nav-item"><a href="#" class="nav-link">gallery</a></div>
        </nav>
      </div>
      <!--menu-->
      <!--slider-->
      <div class="slider">
        <!-- Swiper -->
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide">
              <img src="./src/images/image-1.png" alt="" />
            </div>
            <div class="swiper-slide">
              <img src="./src/images/image-2.png" alt="" />
            </div>
            <div class="swiper-slide">
              <img src="./src/images/image-3.png" alt="" />
            </div>
            <div class="swiper-slide">
              <img src="./src/images/image-4.png" alt="" />
            </div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
          <div class="swiper-pagination"></div>
        </div>
      </div>
      <!--slider-->
    </div>
    <!--start project-->

    <script src="./src/swiper/swiper-bundle.min.js"></script>
    <!-- Initialize Swiper -->
    <script>
      var swiper = new Swiper(".mySwiper", {
        spaceBetween: 0,
        centeredSlides: true,
        autoplay: {
          delay: 2500,
          disableOnInteraction: false,
        },
        pagination: {
          el: ".swiper-pagination",
          clickable: true,
        },
        navigation: {
          nextEl: ".swiper-button-next",
          prevEl: ".swiper-button-prev",
        },
      });
    </script>
  </body>
</html>
